name: CodeQL

# Static security analysis of the Java code. Findings appear under Security > Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1' # Mondays, to catch newly published queries against unchanged code

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Analyze the source directly, without compiling. Fast, and needs no build setup.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
