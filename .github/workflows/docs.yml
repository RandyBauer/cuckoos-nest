name: Docs

# Publishes the documentation site on every push to main: Javadoc, the Lighthouse accessibility
# reports, and links to the other docs. Live at https://randybauer.github.io/cuckoos-nest/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Javadoc
        run: ./gradlew javadoc --console=plain

      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/site/index.html site/
          cp -r build/docs/javadoc site/javadoc
          cp -r docs/accessibility site/accessibility

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
