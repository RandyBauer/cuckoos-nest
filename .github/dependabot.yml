# Dependabot opens weekly pull requests to keep dependencies current.
# Related updates are grouped so there are few PRs to review.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      testing:
        patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "org.mockito*"]
      build-tools:
        patterns: ["com.diffplug*", "com.puppycrawl*", "org.jacoco*", "info.solidsoft*", "org.pitest*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on the Java 21 LTS that the Gradle toolchain targets; take only 21.x updates here.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
