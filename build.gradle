plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.12.0'
	id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'io.github.randybauer'
version = '0.0.1-SNAPSHOT'
description = 'Honeytokens that catch whoever touches them, AI agents included'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.1.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// Coverage: `./gradlew test` writes build/reports/jacoco/test/html/index.html.
// CSV feeds the README badge; XML is the format most tools read.
jacoco {
	toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport') {
	dependsOn 'test'
	reports {
		xml.required = true
		csv.required = true
		html.required = true
	}
}

// Quality gate: `./gradlew check` fails if line coverage drops below 80%.
tasks.named('jacocoTestCoverageVerification') {
	dependsOn 'jacocoTestReport'
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestCoverageVerification'
}

// Formatting: Spotless rewrites code with `./gradlew spotlessApply`; `check` fails if anything is unformatted.
spotless {
	java {
		palantirJavaFormat('2.103.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
	}
}

// Static analysis: Checkstyle covers naming and common mistakes. Formatting is left to Spotless.
checkstyle {
	toolVersion = '14.4.0'
	maxWarnings = 0
}

// Mutation testing: `./gradlew pitest` makes small bugs ("mutants") in the code, such as flipping
// a < to <=, and checks that some test fails for each one. A mutant that survives points at a
// test that runs the code without really checking it. Scoped to the pure logic and its fast unit
// tests, because PIT reruns the tests once per mutant. Report: build/reports/pitest/index.html.
pitest {
	pitestVersion = '1.30.2'
	junit5PluginVersion = '1.2.3'
	targetClasses = [
		'io.github.randybauer.cuckoosnest.decoy.Decoy',
		'io.github.randybauer.cuckoosnest.decoy.Base62',
		'io.github.randybauer.cuckoosnest.decoy.TokenGenerator',
		'io.github.randybauer.cuckoosnest.decoy.DecoyTypeRegistry',
		'io.github.randybauer.cuckoosnest.decoy.types.*',
		'io.github.randybauer.cuckoosnest.config.AdminUserConfig',
	]
	targetTests = [
		'io.github.randybauer.cuckoosnest.decoy.*Tests',
		'io.github.randybauer.cuckoosnest.config.AdminUserConfigTests',
	]
	excludedTestClasses = [
		'io.github.randybauer.cuckoosnest.decoy.DecoyServiceTests',
		'io.github.randybauer.cuckoosnest.decoy.PersistenceTests',
		'io.github.randybauer.cuckoosnest.decoy.DevSeedDataTests',
		'io.github.randybauer.cuckoosnest.decoy.MissCacheTests',
	]
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	mutationThreshold = 90
}
