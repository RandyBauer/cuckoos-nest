spring.application.name=cuckoos-nest

# Actuator: expose only the health and info endpoints. Health details stay private.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Logging: INFO for the app and libraries. Decoy touches log at WARN.
# Structured (JSON) logs are turned on in the prod profile; see application-prod.properties.
logging.level.root=INFO
logging.level.io.github.randybauer.cuckoosnest=INFO

# MCP server: AI agents connect at /mcp (streamable HTTP) with a bearer token.
# STREAMABLE = the current MCP HTTP transport at /mcp. Without this, Spring AI starts the older SSE one.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=cuckoos-nest
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=The Cuckoo's Nest plants decoys (honeytokens) and records every touch.   Use create_decoy to make bait, list_alerts to see touches, and explain_alert to understand one.
nest.mcp.token=${NEST_MCP_TOKEN:}
nest.public-base-url=${NEST_PUBLIC_BASE_URL:http://localhost:8080}
