# Production: every connection setting comes from the environment. There are no defaults,
# so a missing variable stops the app at startup instead of connecting somewhere unexpected.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# Real migrations only. Never seed data.
spring.flyway.locations=classpath:db/migration
