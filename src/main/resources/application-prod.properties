# Production: every connection setting comes from the environment. There are no defaults,
# so a missing variable stops the app at startup instead of connecting somewhere unexpected.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# Real migrations only. Never seed data.
spring.flyway.locations=classpath:db/migration

# Logs are JSON lines in Elastic Common Schema (ECS) format, one object per event, so a log
# service can search them by field (level, logger, decoyId, sourceIp, ...).
logging.structured.format.console=ecs
logging.structured.ecs.service.name=cuckoos-nest

# Behind the Caddy reverse proxy: trust its X-Forwarded-For / X-Forwarded-Proto headers, so alerts
# record the visitor's real IP and redirects use https. Only proxies on private networks are trusted.
server.forward-headers-strategy=native
