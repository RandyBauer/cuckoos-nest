# Local development: the Postgres and Redis from docker-compose.yml, plus sample decoys.
# Start them with: docker compose up postgres redis
spring.datasource.url=jdbc:postgresql://localhost:5432/nest
spring.datasource.username=nest
spring.datasource.password=nest-dev-only
spring.data.redis.host=localhost

# Load the seed data in addition to the real migrations.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Dev-only login: admin / nest-dev-password. Never use this hash anywhere else.
nest.admin.password-hash=$2y$10$NL.o813uIqgMLk5v8PHOJOZZaLZ8IBriZgF42yfu.tUWwlBBtaO9i
nest.mcp.token=dev-mcp-token
